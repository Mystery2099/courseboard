<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Course reviews: workflow options</title>
		<style>
			:root {
				color-scheme: dark;
				font-family: var(--font-sans, system-ui, sans-serif);
				color: var(--foreground, #e4ebff);
				--review-background: var(--background, #0b1222);
				--review-surface: var(--card, #121c33);
				--review-muted: var(--muted-foreground, #aab6d3);
				--review-border: var(--border, #26324f);
				--review-accent: var(--primary, #5ee1ff);
				--review-accent-text: var(--primary-foreground, #002a35);
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
			}

			button,
			input,
			select,
			textarea {
				font: inherit;
			}

			button,
			summary {
				cursor: pointer;
			}

			button,
			select,
			input {
				min-height: 44px;
			}

			button {
				color: inherit;
				background: transparent;
				border: 1px solid var(--review-border);
				border-radius: 12px;
				padding: 9px 14px;
				font-size: 13px;
				font-weight: 600;
			}

			button:focus-visible,
			summary:focus-visible,
			input:focus-visible,
			select:focus-visible,
			textarea:focus-visible {
				outline: 2px solid var(--review-accent);
				outline-offset: 3px;
			}

			.option-buttons,
			.row,
			.facts,
			.actions {
				display: flex;
				align-items: center;
				gap: 10px;
				flex-wrap: wrap;
			}

			.option-buttons {
				margin-bottom: 12px;
			}

			.option-buttons button[aria-pressed='true'] {
				border-color: var(--review-accent);
				color: var(--review-accent);
				background: var(--secondary, #22305a);
			}

			.description {
				margin: 0 0 20px;
				color: var(--review-muted);
				font-size: 13px;
				line-height: 1.6;
			}

			.screen {
				background: var(--review-background);
				padding: 20px;
				border-radius: var(--radius, 16px);
			}

			.course-code {
				color: var(--review-accent);
				font-family: var(--font-mono, monospace);
				font-size: 12px;
				font-weight: 600;
			}

			.course-name {
				font-size: 15px;
				margin: 6px 0 18px;
			}

			.channels {
				display: flex;
				gap: 19px;
				border-bottom: 1px solid var(--review-border);
				padding-bottom: 11px;
				font-size: 12px;
				color: var(--review-muted);
			}

			.channels strong {
				color: var(--review-accent);
				position: relative;
			}

			.channels strong::after {
				content: '';
				position: absolute;
				bottom: -12px;
				height: 2px;
				left: 0;
				right: 0;
				background: var(--review-accent);
			}

			.heading {
				justify-content: space-between;
				margin: 23px 0 16px;
			}

			h1,
			h2,
			h3,
			p {
				margin-top: 0;
			}

			h1 {
				font-size: 27px;
				letter-spacing: -0.8px;
				margin-bottom: 0;
			}

			h2 {
				font-size: 21px;
				letter-spacing: -0.4px;
				margin-bottom: 12px;
			}

			h3 {
				font-size: 17px;
				line-height: 1.4;
				margin-bottom: 9px;
			}

			.primary,
			.compose-trigger {
				background: var(--review-accent);
				color: var(--review-accent-text);
				border: 0;
				font-weight: 650;
			}

			.stats {
				display: grid;
				grid-template-columns: repeat(3, minmax(0, 1fr));
				gap: 12px;
				padding: 17px 0;
				border-block: 1px solid var(--review-border);
				margin-bottom: 10px;
			}

			.stat strong {
				display: block;
				font-size: 27px;
				font-weight: 650;
				letter-spacing: -0.6px;
				margin-bottom: 5px;
			}

			.stat span,
			.small {
				font-size: 12px;
				line-height: 1.55;
				color: var(--review-muted);
			}

			.source-note {
				font-size: 11px;
				line-height: 1.5;
				color: var(--review-muted);
				margin-bottom: 23px;
			}

			.review {
				padding: 20px 0;
				border-bottom: 1px solid var(--review-border);
			}

			.meta {
				font-size: 12px;
				color: var(--review-muted);
				margin-bottom: 12px;
				line-height: 1.6;
			}

			.author {
				color: var(--foreground, #e4ebff);
				font-weight: 600;
			}

			.prose {
				font-family: Georgia, 'Times New Roman', serif;
				font-size: 17px;
				line-height: 1.75;
				margin-bottom: 15px;
				overflow-wrap: anywhere;
			}

			.facts {
				gap: 8px 20px;
				font-size: 12px;
				color: var(--review-muted);
				margin-bottom: 14px;
			}

			.facts b {
				color: var(--foreground, #e4ebff);
				font-weight: 600;
			}

			.reply-link {
				color: var(--review-accent);
				font-size: 12px;
			}

			.composer {
				margin-top: 22px;
				background: var(--review-surface);
				padding: 20px;
				border-radius: var(--radius, 16px);
			}

			.compose-trigger {
				display: inline-block;
				list-style-position: inside;
				padding: 12px 16px;
				border-radius: 12px;
				font-size: 13px;
			}

			details[open] > .compose-trigger {
				margin-bottom: 20px;
			}

			.fields {
				display: grid;
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: 16px;
				margin-bottom: 18px;
			}

			label,
			legend {
				display: block;
				font-size: 12px;
				font-weight: 600;
				margin-bottom: 7px;
			}

			input,
			select,
			textarea {
				width: 100%;
				background: var(--review-background);
				color: inherit;
				border: 1px solid var(--review-border);
				border-radius: 10px;
				padding: 11px;
				font-size: 16px;
			}

			select {
				text-overflow: ellipsis;
			}

			textarea {
				min-height: 146px;
				resize: vertical;
				line-height: 1.6;
			}

			.field {
				margin-bottom: 17px;
			}

			.disclosure {
				margin: 19px 0;
				border-left: 3px solid var(--warning, #ffa65c);
				padding-left: 12px;
				font-size: 13px;
				line-height: 1.6;
			}

			.actions {
				justify-content: flex-end;
				margin-top: 18px;
			}

			.publication-note {
				margin: 12px 0 0;
				font-size: 11px;
				color: var(--review-muted);
			}

			.editor-header {
				border-bottom: 1px solid var(--review-border);
				padding-bottom: 18px;
				margin-bottom: 20px;
			}

			.editor-header h1 {
				margin: 12px 0;
			}

			.snapshot {
				border-left: 2px solid var(--review-accent);
				padding: 3px 0 3px 12px;
				margin-bottom: 20px;
			}

			.inline-composer {
				border-block: 1px solid var(--review-border);
				padding: 23px 0;
				margin-bottom: 12px;
			}

			.inline-composer .composer {
				background: transparent;
				padding: 0;
				margin-top: 18px;
			}

			.states {
				margin-top: 20px;
				border-top: 1px solid var(--review-border);
				padding-top: 16px;
			}

			.states > summary {
				font-size: 13px;
				min-height: 36px;
				padding: 6px 0;
			}

			.state {
				margin-top: 16px;
				padding-left: 12px;
				border-left: 2px solid var(--review-border);
			}

			.state h3 {
				font-size: 14px;
			}

			.state p {
				font-size: 13px;
				color: var(--review-muted);
				line-height: 1.6;
				margin-bottom: 8px;
			}

			[hidden] {
				display: none !important;
			}

			@media (max-width: 480px) {
				.screen {
					padding: 16px;
				}

				.option-buttons {
					gap: 6px;
				}

				.option-buttons button {
					flex: 1;
					padding: 8px;
					font-size: 12px;
				}

				.channels {
					gap: 15px;
				}

				.stat strong {
					font-size: 23px;
				}

				.fields {
					grid-template-columns: 1fr;
					gap: 12px;
				}

				.composer {
					padding: 16px;
				}

				.heading {
					align-items: flex-start;
				}
			}
		</style>
	</head>
	<body>
		<nav class="option-buttons" aria-label="Review workflow options">
			<button type="button" data-option="a" aria-pressed="true">A · List + composer</button>
			<button type="button" data-option="b" aria-pressed="false">B · Writing page</button>
			<button type="button" data-option="c" aria-pressed="false">C · Inline review</button>
		</nav>
		<p class="description" id="option-description">
			Recommended: keep the familiar course list. Open a compact composer to write, then open a
			thread to read and reply. All content here is fictional; nothing is saved.
		</p>
		<main id="mockup" class="screen"></main>

		<template id="course-header">
			<header>
				<div class="course-code">ALFRED STATE · CISY 8503</div>
				<h2 class="course-name">Applied Database Management</h2>
				<nav class="channels" aria-label="Course views">
					<span>Overview</span><span>Questions</span><strong>Reviews</strong><span>Discussion</span>
				</nav>
			</header>
		</template>

		<template id="statistics">
			<div class="stats" aria-label="Statistics from 12 published reviews">
				<div class="stat"><strong>12</strong><span>Reviews</span></div>
				<div class="stat"><strong>3.8 <small>/ 5</small></strong><span>Avg. workload</span></div>
				<div class="stat"><strong>83%</strong><span>Would take again</span></div>
			</div>
			<p class="source-note">Based on published reviews, not private academic histories.</p>
		</template>

		<template id="review-list">
			<article class="review">
				<p class="meta">
					<span class="author">Jules Rivera</span> · @jules.r · Nov 12<br />
					Took · Fall 2025 · self-reported
				</p>
				<h3>Choose a project you actually care about</h3>
				<div class="facts">
					<span>Workload <b>4 / 5</b></span><span>Would take again <b>Yes</b></span>
				</div>
				<p class="prose">
					The labs are where everything clicks. Start with a small dataset and a real question,
					then build out the queries. Leaving the demonstration until the last week made this
					harder than it needed to be.
				</p>
				<span class="reply-link">4 replies · Open review →</span>
			</article>
			<article class="review">
				<p class="meta">
					<span class="author">Sam Chen</span> · @sam.c · Nov 10<br />
					Taking · Fall 2026 · self-reported
				</p>
				<h3>A practical follow-up to SQL</h3>
				<div class="facts">
					<span>Workload <b>3 / 5</b></span><span>Would take again <b>Yes</b></span>
				</div>
				<p class="prose">
					Explaining why you chose a document shape matters as much as getting the app working.
					Keep notes on those decisions while you build.
				</p>
				<span class="reply-link">2 replies · Open review →</span>
			</article>
		</template>

		<template id="review-fields">
			<div class="field">
				<label>Reviewing this attempt</label>
				<select aria-label="Reviewing this attempt">
					<option>Taking · Fall 2026</option>
					<option>Took · Spring 2025</option>
				</select>
				<p class="publication-note">Status and term stay fixed after publishing.</p>
			</div>
			<div class="fields">
				<div>
					<label>Workload</label>
					<select aria-label="Workload">
						<option>1 / 5 · Very light</option>
						<option>2 / 5 · Light</option>
						<option>3 / 5 · Moderate</option>
						<option selected>4 / 5 · Heavy</option>
						<option>5 / 5 · Very heavy</option>
					</select>
				</div>
				<div>
					<label>Would you take it again?</label>
					<select aria-label="Would you take it again?">
						<option>Yes</option>
						<option>No</option>
					</select>
				</div>
			</div>
			<div class="field">
				<label>Title</label>
				<input aria-label="Title" value="Build something you want to keep using" />
			</div>
			<div class="field">
				<label>Your review</label>
				<textarea aria-label="Your review">
Picking a project I cared about made the database work much more interesting. Plan time to explain your queries and test the privacy rules.</textarea
				>
			</div>
			<p class="disclosure">
				Publishing shares that you’re taking this course in Fall 2026, even if your history entry
				is private. It stays labeled self-reported. Your history visibility and notes won’t change.
			</p>
			<div class="actions">
				<button type="button" class="primary" data-demo-publish>Publish review</button>
			</div>
			<p class="publication-note" role="status" data-demo-status>
				Static design only. Publishing is disabled.
			</p>
		</template>

		<template id="supporting-states">
			<details class="states">
				<summary>Other states: eligibility, editing, empty course</summary>
				<section class="state">
					<h3>Add this course to your history first</h3>
					<p>
						A Taking or Took entry is needed to write a review. Planning and following don’t
						qualify. Adding history does not publish a review or follow the course.
					</p>
					<button type="button">Add to history</button>
				</section>
				<section class="state">
					<h3>You’ve already reviewed this course</h3>
					<p>
						Edit feedback, workload, and would-take-again. Course, status, and term stay fixed.
						Changing or deleting your history won’t change the published snapshot.
					</p>
					<button type="button">Edit your review</button>
				</section>
				<section class="state">
					<h3>No reviews yet</h3>
					<p>Be the first to share your experience. No averages are shown until a review exists.</p>
				</section>
			</details>
		</template>

		<script>
			const descriptions = {
				a: 'Recommended: keep the familiar course list. Open a compact composer to write, then open a thread to read and reply. All content here is fictional; nothing is saved.',
				b: 'Writing-first: a dedicated page gives the review room to breathe. Desktop shows all fields; mobile uses the same single-column flow. All content here is fictional; nothing is saved.',
				c: 'Inline: write directly above the reviews, with statistics still in view. Fewer navigation steps, but a taller course page. All content here is fictional; nothing is saved.'
			};

			const mockup = document.querySelector('#mockup');

			function template(name) {
				return document.querySelector(`#${name}`).innerHTML;
			}

			function showOption(option) {
				document.querySelectorAll('[data-option]').forEach((button) => {
					button.setAttribute('aria-pressed', String(button.dataset.option === option));
				});
				document.querySelector('#option-description').textContent = descriptions[option];

				if (option === 'a') {
					mockup.innerHTML = `
						${template('course-header')}
						<div class="row heading"><h1>Reviews</h1><span class="small">Newest activity</span></div>
						${template('statistics')}
						<details class="composer">
							<summary class="compose-trigger">Write a review</summary>
							<h2>Your experience with this course</h2>
							${template('review-fields')}
						</details>
						${template('review-list')}
						${template('supporting-states')}
					`;
				} else if (option === 'b') {
					mockup.innerHTML = `
						<header class="editor-header">
							<span class="small">← Back to reviews</span>
							<h1>Write a review</h1>
							<span class="course-code">CISY 8503 · Applied Database Management</span>
						</header>
						<div class="snapshot">
							<strong>One review. Your experience.</strong>
							<p class="small" style="margin: 7px 0 0">You can edit your feedback and ratings after publishing.</p>
						</div>
						${template('review-fields')}
						${template('supporting-states')}
					`;
				} else {
					mockup.innerHTML = `
						${template('course-header')}
						<div class="row heading"><h1>Reviews</h1></div>
						${template('statistics')}
						<section class="inline-composer">
							<h2>Share your experience</h2>
							<div class="composer">${template('review-fields')}</div>
						</section>
						<p class="small">Published reviews · newest activity</p>
						${template('review-list')}
						${template('supporting-states')}
					`;
				}
			}

			document.querySelectorAll('[data-option]').forEach((button) => {
				button.addEventListener('click', () => showOption(button.dataset.option));
			});
			mockup.addEventListener('click', (event) => {
				if (event.target.closest('[data-demo-publish]')) {
					mockup.querySelector('[data-demo-status]').textContent =
						'Design preview only. No review was published and nothing was saved.';
				}
			});
			mockup.addEventListener('change', (event) => {
				if (event.target.matches('[aria-label="Reviewing this attempt"]')) {
					const disclosure = mockup.querySelector('.disclosure');
					disclosure.textContent =
						event.target.selectedIndex === 0
							? 'Publishing shares that you’re taking this course in Fall 2026, even if your history entry is private. It stays labeled self-reported. Your history visibility and notes won’t change.'
							: 'Publishing shares that you took this course in Spring 2025, even if your history entry is private. It stays labeled self-reported. Your history visibility and notes won’t change.';
				}
			});
			showOption('a');
		</script>
	</body>
</html>
